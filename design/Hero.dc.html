.rsp-ring{transform-box:fill-box;transform-origin:center;animation:rsp-ping 2.6s ease-out infinite}
@keyframes rsp-ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.4);opacity:0}}
.rsp-live{animation:rsp-blink 1.6s ease-in-out infinite}
@keyframes rsp-blink{0%,100%{opacity:1}50%{opacity:.35}}

          <span>Start your MVP</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"></path></svg>

        <img src="/_blob/bc13b4101ba484001c62ea9bfd7579c4" alt="" style="position: absolute; top: 0; left: 0; width: 720px; height: 280px; display: block">

            <path class="rsp-arc" pathLength="100" d="M568 158 Q615 158 662 228" style="animation-delay: 1.8s"></path>
            <path class="rsp-arc" pathLength="100" d="M116 84 Q164 52 212 78" style="animation-delay: 2.4s"></path>
            <path class="rsp-arc" pathLength="100" d="M268 206 Q317 143 366 148" style="animation-delay: 0.9s"></path>
            <path class="rsp-arc" pathLength="100" d="M640 88 Q604 93 568 158" style="animation-delay: 2s"></path>
            <path class="rsp-arc" pathLength="100" d="M360 58 Q390 103 366 148" style="animation-delay: 1.5s"></path>

            <circle class="rsp-ring" cx="662" cy="228" r="4" style="animation-delay: 1.6s"></circle>
            <circle class="rsp-ring" cx="116" cy="84" r="4" style="animation-delay: 2s"></circle>
            <circle class="rsp-ring" cx="268" cy="206" r="4" style="animation-delay: 0.6s"></circle>
            <circle class="rsp-ring" cx="366" cy="148" r="4" style="animation-delay: 1s"></circle>

          </g>

      <!-- Progress strip -->
      <div style="display: flex; align-items: center; gap: 20px; padding: 18px 22px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(20,22,26,0.06), 0 10px 24px -14px rgba(20,22,26,0.2)">

          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #545A66">MVP sprint</span>

        </div>
        <div style="flex-grow: 1; height: 10px; border-radius: 10px; background: #EEF0F3; box-shadow: inset 0 1px 2px rgba(20,22,26,0.08); overflow: hidden">
          <div style="height: 10px; border-radius: 10px; background: #C2323F; width: {{pct}}; transition: width 0.25s linear"></div>
        </div>
        <span style="min-width: 110px; text-align: right; font-size: 14px; font-weight: 700; color: #C2323F">{{stage}}</span>
      </div>
    </div>

    
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"animate":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tick: 0 };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      this.setState((s) => ({ tick: (s.tick + 1) % 30 }));
    }, 320);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const animate = this.props.animate ?? true;
    const day = animate ? Math.min(21, this.state.tick + 1) : 21;
    let stage = 'Plan & design';
    if (day >= 8) stage = 'Build';
    if (day >= 15) stage = 'Test & launch';
    if (day === 21) stage = 'Launched';
    return { day, stage, pct: Math.round((day / 21) * 100) + '%' };
  }
}
</script>

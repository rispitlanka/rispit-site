<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rispit — From the blog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14161A}a:hover{color:#A3242F}
</style>
</helmet>
<section style="width: 1440px; height: 820px; box-sizing: border-box; padding: 96px 24px 24px; display: flex; flex-direction: column; gap: 48px; background: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14161A">

  <!-- Header -->
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 48px; padding: 0 24px">
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px; max-width: 760px">
      <span style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECEEF1; box-shadow: 0 1px 2px rgba(20,22,26,0.06); color: #A3242F; font-size: 13px; font-weight: 700">
        <span style="display: block; width: 8px; height: 8px; border-radius: 8px; background: #C2323F"></span>
        <span>From the Blog</span>
      </span>
      <h2 style="margin: 0; font-size: 52px; line-height: 1.08; font-weight: 800; letter-spacing: -0.035em">Lessons from <span style="color: #C2323F">building MVPs.</span></h2>
    </div>
    <a href="/BlogList.dc.html" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px; border-radius: 16px; background: #FFFFFF; border: 1px solid #ECEEF1; box-shadow: 0 1px 2px rgba(20,22,26,0.06), 0 8px 18px -10px rgba(20,22,26,0.2); font-size: 16px; font-weight: 700; text-decoration: none">
      <span>View all articles</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2323F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"></path></svg>
    </a>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
    <sc-for list="{{posts}}" as="p" hint-placeholder-count="3">
      <article style="height: 540px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; border-radius: 28px; background: #F7F8FA; border: 1px solid #ECEEF1; box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(20,22,26,0.04), 0 16px 36px -18px rgba(20,22,26,0.2)">

        <!-- Cover -->
        <div aria-hidden="true" style="position: relative; height: 240px; flex-shrink: 0; border-radius: 20px; background: {{p.coverBg}}; overflow: hidden; display: flex; align-items: center; justify-content: center">
          <span style="position: absolute; width: 220px; height: 220px; border-radius: 220px; right: -60px; top: -70px; background: {{p.blob}}"></span>
          <span style="position: absolute; width: 120px; height: 120px; border-radius: 120px; left: -30px; bottom: -40px; background: {{p.blob}}"></span>
          <span style="position: relative; width: 96px; height: 96px; border-radius: 28px; background: #FFFFFF; box-shadow: inset 0 1px 0 #FFFFFF, 0 18px 36px -14px rgba(20,22,26,0.35); display: flex; align-items: center; justify-content: center">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#C2323F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{p.icon}}"></path></svg>
          </span>
          <span style="position: absolute; left: 14px; top: 14px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.94); font-size: 12px; font-weight: 700; color: #14161A">{{p.tag}}</span>
        </div>

        <!-- Body -->
        <div style="flex-grow: 1; padding: 22px 16px 10px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #545A66">
            <span>[Date]</span>
            <span style="width: 4px; height: 4px; border-radius: 4px; background: #A0A5AF"></span>
            <span>{{p.read}}</span>
          </div>
          <h3 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 800; letter-spacing: -0.02em">{{p.title}}</h3>
          <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #545A66; font-weight: 500">{{p.excerpt}}</p>
          <a href="{{p.href}}" style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid #E3E5E9; font-size: 15px; font-weight: 700; text-decoration: none">
            <span>Read article</span>
            <span style="width: 36px; height: 36px; border-radius: 12px; background: #FFFFFF; border: 1px solid #ECEEF1; display: flex; align-items: center; justify-content: center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C2323F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg>
            </span>
          </a>
        </div>
      </article>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      posts: [
        {
          tag: 'Product strategy', read: '6 min read', href: '#blog-scope-mvp',
          coverBg: '#FBECEE', blob: 'rgba(194,50,63,0.12)',
          icon: 'M9 11l3 3L22 4 M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
          title: 'How to scope your MVP so it ships in 21 days',
          excerpt: 'A simple way to decide what goes into your first version, and what can safely wait.'
        },
        {
          tag: 'Development', read: '8 min read', href: '#blog-nocode',
          coverBg: '#EEF1F5', blob: 'rgba(20,22,26,0.06)',
          icon: 'M16 18l6-6-6-6 M8 6l-6 6 6 6',
          title: 'No-code or custom code: what is right for your first version?',
          excerpt: 'The honest trade-offs in cost, speed and flexibility, so you can choose with confidence.'
        },
        {
          tag: 'AI', read: '5 min read', href: '#blog-ai',
          coverBg: '#FBECEE', blob: 'rgba(194,50,63,0.12)',
          icon: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z',
          title: 'Adding AI to your product without overbuilding',
          excerpt: 'Where AI features genuinely help early users, and where they just add cost.'
        }
      ]
    };
  }
}
</script>
</body>
</html>

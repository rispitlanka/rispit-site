<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rispit — Technologies (variant B, orbit)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.rsp-spin{animation:rsp-spin 40s linear infinite}
.rsp-spin-rev{animation:rsp-spin 40s linear infinite reverse}
.rsp-spin2{animation:rsp-spin 60s linear infinite reverse}
.rsp-spin2-rev{animation:rsp-spin 60s linear infinite}
@keyframes rsp-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.rsp-core{animation:rsp-glow 3s ease-in-out infinite}
@keyframes rsp-glow{0%,100%{box-shadow:0 0 0 0 rgba(194,50,63,.35),0 20px 40px -16px rgba(194,50,63,.55)}50%{box-shadow:0 0 0 18px rgba(194,50,63,0),0 20px 40px -16px rgba(194,50,63,.55)}}
.rsp-orbit:hover .rsp-spin,.rsp-orbit:hover .rsp-spin-rev,.rsp-orbit:hover .rsp-spin2,.rsp-orbit:hover .rsp-spin2-rev{animation-play-state:paused}
</style>
</helmet>
<section style="width: 1440px; height: 680px; box-sizing: border-box; padding: 72px 24px 24px; background: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14161A">
  <div style="height: 100%; box-sizing: border-box; padding: 0 56px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; align-items: center; border-radius: 28px; background: #F7F8FA; border: 1px solid #ECEEF1; box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(20,22,26,0.04), 0 14px 30px -18px rgba(20,22,26,0.2); overflow: hidden">

    <!-- Copy -->
    <div style="grid-column: span 5; display: flex; flex-direction: column; align-items: flex-start; gap: 20px">
      <span style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECEEF1; box-shadow: 0 1px 2px rgba(20,22,26,0.06); color: #A3242F; font-size: 13px; font-weight: 700">
        <span style="display: block; width: 8px; height: 8px; border-radius: 8px; background: #C2323F"></span>
        <span>Technologies We Use</span>
      </span>
      <h2 style="margin: 0; font-size: 46px; line-height: 1.08; font-weight: 800; letter-spacing: -0.035em">One team. <span style="color: #C2323F">A modern stack</span> around your product.</h2>
      <p style="margin: 0; max-width: 440px; font-size: 17px; line-height: 1.6; color: #545A66; font-weight: 500">Proven tools that let us move fast now, and let your team keep building on the same code later.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px">
        <span style="padding: 7px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECEEF1; font-size: 13px; font-weight: 700; color: #545A66">Design</span>
        <span style="padding: 7px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECEEF1; font-size: 13px; font-weight: 700; color: #545A66">Web</span>
        <span style="padding: 7px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECEEF1; font-size: 13px; font-weight: 700; color: #545A66">Mobile</span>
        <span style="padding: 7px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECEEF1; font-size: 13px; font-weight: 700; color: #545A66">Backend</span>
        <span style="padding: 7px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECEEF1; font-size: 13px; font-weight: 700; color: #545A66">AI</span>
        <span style="padding: 7px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECEEF1; font-size: 13px; font-weight: 700; color: #545A66">Cloud</span>
      </div>
    </div>

    <!-- Orbit -->
    <div class="rsp-orbit" role="img" aria-label="Tools we use, orbiting around Rispit: {{allNames}}" style="grid-column: span 7; position: relative; height: 584px">
      <div style="position: absolute; left: 50%; top: 50%; width: 0; height: 0">

        <!-- Rings -->
        <span style="position: absolute; left: -250px; top: -250px; width: 500px; height: 500px; border-radius: 500px; border: 1.5px dashed #DADCE1; box-sizing: border-box"></span>
        <span style="position: absolute; left: -150px; top: -150px; width: 300px; height: 300px; border-radius: 300px; border: 1.5px dashed #E7B9BF; box-sizing: border-box"></span>

        <!-- Outer ring -->
        <div class="rsp-spin2" style="position: absolute; left: 0; top: 0; width: 0; height: 0">
          <sc-for list="{{outer}}" as="t" hint-placeholder-count="8">
            <div style="position: absolute; left: 0; top: 0; transform: {{t.place}}">
              <div style="transform: {{t.unrotate}}">
                <div class="rsp-spin2-rev">
                  <span style="position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px 0 7px; border-radius: 14px; background: #FFFFFF; border: 1px solid #ECEEF1; box-shadow: 0 1px 2px rgba(20,22,26,0.06), 0 10px 22px -12px rgba(20,22,26,0.3); white-space: nowrap">
                    <span style="width: 34px; height: 34px; border-radius: 10px; background: #F7F8FA; border: 1px solid #ECEEF1; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><img src="{{t.logo}}" alt="" style="width: 22px; height: 22px; display: block; object-fit: contain"></span>
                    <span style="font-size: 14px; font-weight: 800">{{t.name}}</span>
                  </span>
                </div>
              </div>
            </div>
          </sc-for>
        </div>

        <!-- Inner ring -->
        <div class="rsp-spin" style="position: absolute; left: 0; top: 0; width: 0; height: 0">
          <sc-for list="{{inner}}" as="t" hint-placeholder-count="5">
            <div style="position: absolute; left: 0; top: 0; transform: {{t.place}}">
              <div style="transform: {{t.unrotate}}">
                <div class="rsp-spin-rev">
                  <span style="position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px 0 7px; border-radius: 14px; background: #FFFFFF; border: 1px solid #ECEEF1; box-shadow: 0 1px 2px rgba(20,22,26,0.06), 0 10px 22px -12px rgba(20,22,26,0.3); white-space: nowrap">
                    <span style="width: 34px; height: 34px; border-radius: 10px; background: #F7F8FA; border: 1px solid #ECEEF1; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><img src="{{t.logo}}" alt="" style="width: 22px; height: 22px; display: block; object-fit: contain"></span>
                    <span style="font-size: 14px; font-weight: 800">{{t.name}}</span>
                  </span>
                </div>
              </div>
            </div>
          </sc-for>
        </div>

        <!-- Core -->
        <span class="rsp-core" style="position: absolute; left: -56px; top: -56px; width: 112px; height: 112px; border-radius: 112px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <img src="/_blob/82822259e9e80e60af7f19aab558f522" alt="" style="width: 88px; height: 88px; display: block">
        </span>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    // Official logos, served from /public/logos (devicon, MIT; OpenAI from Simple Icons, CC0)
    const logos = { 'React': 'react', 'React Native': 'react', 'Next.js': 'nextjs', 'TypeScript': 'typescript', 'Node.js': 'nodejs', 'Figma': 'figma', 'Tailwind CSS': 'tailwindcss', 'Flutter': 'flutter', 'Python': 'python', 'PostgreSQL': 'postgresql', 'Supabase': 'supabase', 'OpenAI': 'openai', 'Vercel': 'vercel', 'AWS': 'aws' };
    const ring = (names, r, offset) => names.map((name, i) => {
      const a = offset + (360 / names.length) * i;
      return { name, logo: '/logos/' + logos[name] + '.svg', place: 'rotate(' + a + 'deg) translateX(' + r + 'px)', unrotate: 'rotate(' + (-a) + 'deg)' };
    });
    const innerNames = ['React', 'Next.js', 'TypeScript', 'Node.js', 'Figma'];
    const outerNames = ['Tailwind CSS', 'React Native', 'Flutter', 'Python', 'PostgreSQL', 'Supabase', 'OpenAI', 'Vercel', 'AWS'];
    return {
      inner: ring(innerNames, 150, -90),
      outer: ring(outerNames, 250, -70),
      allNames: innerNames.concat(outerNames).join(', ')
    };
  }
}
</script>
</body>
</html>

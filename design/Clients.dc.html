<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rispit — Our Clients</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A3242F}a:hover{color:#14161A}
.rsp-fade{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 120px,#000 calc(100% - 120px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 120px,#000 calc(100% - 120px),transparent 100%)}
.rsp-track-l{animation:rsp-left 36s linear infinite}
.rsp-track-r{animation:rsp-right 40s linear infinite}
.rsp-fade:hover .rsp-track-l,.rsp-fade:hover .rsp-track-r{animation-play-state:paused}
@keyframes rsp-left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes rsp-right{from{transform:translateX(-50%)}to{transform:translateX(0)}}
</style>
</helmet>
<section style="width: 1440px; height: 540px; box-sizing: border-box; padding: 72px 24px 24px; background: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14161A">
  <div style="height: 100%; box-sizing: border-box; padding: 48px 0; display: flex; flex-direction: column; gap: 44px; border-radius: 28px; background: #F7F8FA; border: 1px solid #ECEEF1; box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(20,22,26,0.04), 0 16px 36px -18px rgba(20,22,26,0.2); overflow: hidden">

    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 48px; padding: 0 48px">
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
        <span style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(20,22,26,0.06), inset 0 -1px 0 rgba(20,22,26,0.04); color: #A3242F; font-size: 13px; font-weight: 700">
          <span style="display: block; width: 8px; height: 8px; border-radius: 8px; background: #C2323F"></span>
          <span>Our Clients</span>
        </span>
        <h2 style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 800; letter-spacing: -0.035em">Startups and teams <span style="color: #C2323F">we've built with.</span></h2>
      </div>
      <p style="margin: 0; max-width: 380px; font-size: 16px; line-height: 1.6; color: #545A66; font-weight: 500">From first-time founders to growing companies, we help them ship products their customers love.</p>
    </div>

    <div class="rsp-fade" style="display: flex; flex-direction: column; gap: 16px">
      <div style="overflow: hidden">
        <div class="rsp-track-l" style="display: flex; gap: 16px; width: max-content">
          <sc-for list="{{rowA}}" as="logo" hint-placeholder-count="12">
            <div style="height: 76px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #ECEEF1; box-shadow: 0 1px 2px rgba(20,22,26,0.05), 0 8px 18px -12px rgba(20,22,26,0.18); flex-shrink: 0">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="#7A808C" aria-hidden="true"><path d="{{logo.d}}"></path></svg>
              <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: #6B717D; white-space: nowrap">{{logo.name}}</span>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="overflow: hidden">
        <div class="rsp-track-r" style="display: flex; gap: 16px; width: max-content">
          <sc-for list="{{rowB}}" as="logo" hint-placeholder-count="12">
            <div style="height: 76px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #ECEEF1; box-shadow: 0 1px 2px rgba(20,22,26,0.05), 0 8px 18px -12px rgba(20,22,26,0.18); flex-shrink: 0">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="#7A808C" aria-hidden="true"><path d="{{logo.d}}"></path></svg>
              <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: #6B717D; white-space: nowrap">{{logo.name}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    const shapes = {
      circle: 'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20Z',
      triangle: 'M12 2L22 20H2Z',
      square: 'M4 4h16v16H4Z',
      diamond: 'M12 1l11 11-11 11L1 12Z',
      half: 'M12 2a10 10 0 0 1 0 20Z M2 12a10 10 0 0 1 10-10v20A10 10 0 0 1 2 12Z',
      bars: 'M3 4h18v4H3Z M3 10h12v4H3Z M3 16h6v4H3Z',
      ring: 'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20Zm0 5a5 5 0 1 1 0 10a5 5 0 1 1 0-10Z',
      hex: 'M12 1l9.5 5.5v11L12 23l-9.5-5.5v-11Z'
    };
    const a = [
      { name: 'Lumora', d: shapes.circle },
      { name: 'Kestrel', d: shapes.triangle },
      { name: 'Orbitly', d: shapes.ring },
      { name: 'Fernway', d: shapes.bars },
      { name: 'Quantix', d: shapes.hex },
      { name: 'Brightpath', d: shapes.diamond }
    ];
    const b = [
      { name: 'Velora', d: shapes.half },
      { name: 'Harbor & Co', d: shapes.square },
      { name: 'Nimbly', d: shapes.ring },
      { name: 'Solace', d: shapes.circle },
      { name: 'Craftly', d: shapes.hex },
      { name: 'Pinecrest', d: shapes.triangle }
    ];
    return { rowA: a.concat(a), rowB: b.concat(b) };
  }
}
</script>
</body>
</html>

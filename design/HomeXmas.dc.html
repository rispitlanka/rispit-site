/* ---------- Snow caps on cards ---------- */
.xmas [style*="border-radius: 28px"][style*="background: #F7F8FA"],
.xmas [style*="border-radius: 24px"][style*="background: #F7F8FA"],
.xmas [style*="border-radius: 28px"][style*="background: #C2323F"],
.xmas [style*="border-radius: 32px"][style*="background: #C2323F"],
.xmas header[style*="border-radius: 22px"]{position:relative}
.xmas [style*="border-radius: 28px"][style*="background: #F7F8FA"]::before,
.xmas [style*="border-radius: 24px"][style*="background: #F7F8FA"]::before,
.xmas [style*="border-radius: 28px"][style*="background: #C2323F"]::before,
.xmas [style*="border-radius: 32px"][style*="background: #C2323F"]::before,
.xmas header[style*="border-radius: 22px"]::before,
.rsp-cap::before{
  content:"";position:absolute;left:22px;right:22px;top:-8px;height:16px;z-index:5;pointer-events:none;
  background:#FFFFFF;border-radius:16px 16px 12px 12px;
  box-shadow:0 2px 0 #E6EDF5,0 4px 10px -2px rgba(120,140,165,.35)
}
.xmas [style*="border-radius: 28px"][style*="background: #F7F8FA"]::after,
.xmas [style*="border-radius: 24px"][style*="background: #F7F8FA"]::after,
.xmas [style*="border-radius: 28px"][style*="background: #C2323F"]::after,
.xmas [style*="border-radius: 32px"][style*="background: #C2323F"]::after,
.xmas header[style*="border-radius: 22px"]::after,
.rsp-cap::after{
  content:"";position:absolute;left:22px;right:22px;top:4px;height:16px;z-index:5;pointer-events:none;
  background:
    radial-gradient(circle 7px at 6% 0,#FFFFFF 98%,transparent 100%),
    radial-gradient(circle 10px at 17% 0,#FFFFFF 98%,transparent 100%),
    radial-gradient(circle 5px at 31% 0,#FFFFFF 98%,transparent 100%),
    radial-gradient(circle 8px at 46% 0,#FFFFFF 98%,transparent 100%),
    radial-gradient(circle 12px at 63% 0,#FFFFFF 98%,transparent 100%),
    radial-gradient(circle 6px at 78% 0,#FFFFFF 98%,transparent 100%),
    radial-gradient(circle 9px at 92% 0,#FFFFFF 98%,transparent 100%);
  filter:drop-shadow(0 2px 1px rgba(120,140,165,.28))
}

/* ---------- Falling snow ---------- */
.rsp-flake{position:absolute;pointer-events:none;animation:rsp-fall linear infinite}
@keyframes rsp-fall{0%{transform:translateY(-40px) translateX(0) rotate(0);opacity:0}10%{opacity:1}50%{transform:translateY(520px) translateX(18px) rotate(180deg)}90%{opacity:1}100%{transform:translateY(1100px) translateX(-10px) rotate(360deg);opacity:0}}

/* ---------- Garland lights ---------- */
.rsp-bulb{animation:rsp-glow 1.6s ease-in-out infinite}
@keyframes rsp-glow{0%,100%{opacity:1}50%{opacity:.35}}
.rsp-sway{transform-origin:top center;animation:rsp-sway 3.2s ease-in-out infinite}
@keyframes rsp-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* ---------- Festive theming ---------- */
.xsec [style*="background: #FFFFFF; font-family"]{background:transparent !important}
.xsec > *:not(svg):not(div[aria-hidden]){position:relative;z-index:2}
.xmas [style*="border-radius: 28px"][style*="background: #F7F8FA"],
.xmas [style*="border-radius: 24px"][style*="background: #F7F8FA"]{background:#FFFFFF !important;border-color:#F0DFE1 !important;box-shadow:inset 0 1px 0 #FFFFFF,0 1px 2px rgba(20,22,26,.04),0 18px 40px -20px rgba(163,36,47,.22) !important}
.rsp-tw{animation:rsp-tw 2.6s ease-in-out infinite}
@keyframes rsp-tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.82) rotate(18deg)}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":8346}}'>
class Component extends DCLogic {
  renderVals() {
    const rnd = (i, k) => {
      const v = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
      return v - Math.floor(v);
    };
    const flakes = [];
    for (let i = 0; i < 120; i++) {
      const s = 10 + Math.round(rnd(i, 1) * 14);
      flakes.push({
        s,
        x: (rnd(i, 2) * 98).toFixed(1) + '%',
        y: Math.round(rnd(i, 3) * 7600) + 'px',
        dur: (9 + rnd(i, 4) * 9).toFixed(1) + 's',
        d: (-rnd(i, 5) * 12).toFixed(1) + 's',
        o: (0.45 + rnd(i, 6) * 0.5).toFixed(2),
        c: rnd(i, 7) > 0.5 ? '#B9C9DA' : '#D3DEEA'
      });
    }
    const colors = [['#C2323F', 'rgba(194,50,63,0.7)'], ['#E8C15A', 'rgba(232,193,90,0.8)'], ['#2E9E5B', 'rgba(46,158,91,0.7)'], ['#5B9BD5', 'rgba(91,155,213,0.7)']];
    const bulbs = [];
    for (let i = 0; i < 24; i++) {
      const x = 52 + i * 58;
      const phase = ((x - 40) % 180) / 180;
      const y = Math.round(2 + 52 * phase * (1 - phase));
      const c = colors[i % 4];
      bulbs.push({ x: x + 'px', y: y + 'px', c: c[0], glow: c[1], d: ((i % 4) * 0.4).toFixed(1) + 's' });
    }
    return { flakes, bulbs };
  }
}
